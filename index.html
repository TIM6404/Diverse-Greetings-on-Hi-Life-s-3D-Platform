<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hi-Life 3D 便利商店</title>
<style>
:root{--s1:#1e293b;--s2:#4a86ad;--fg:#e2e8f0;--fg2:rgba(226,232,240,.74);--glass:rgba(15,23,42,.6);--glass2:rgba(56,189,248,.14);--bd:rgba(56,189,248,.3);--ac:#38bdf8;--vi:#c084fc;--mg:#f472b6;--tr:rgba(255,255,255,.16);--mf:rgba(244,114,182,.5);--ms:rgba(247,238,222,.92);--r:20px;--sh:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);--sat:env(safe-area-inset-top,0px)}
body.nt{--mf:rgba(192,132,252,.45);--ms:rgba(233,223,250,.85);--bd:rgba(192,132,252,.38)}
html,body{margin:0;height:100%;overflow:hidden;font:500 14px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--fg);background:linear-gradient(var(--s1),var(--s2))}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tw{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;fill:var(--mf);stroke:var(--ms);stroke-width:3px;stroke-linejoin:round}
#tw path{vector-effect:non-scaling-stroke}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#defs{position:absolute;width:0;height:0}
.g1{position:fixed;background:var(--glass);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--sh)}
button{font:inherit;color:inherit}
.ci{display:grid;place-items:center;width:48px;height:48px;padding:0;border-radius:50%;cursor:pointer;color:var(--fg);background:linear-gradient(145deg,rgba(30,41,59,.9),rgba(15,23,42,.9));border:1px solid rgba(56,189,248,.5);box-shadow:0 0 14px rgba(56,189,248,.4),0 6px 14px rgba(0,0,0,.5);transition:box-shadow .2s,border-color .2s,transform .12s}
.ci svg{width:22px;height:22px}
.ci.s{width:34px;height:34px}.ci.s svg{width:18px;height:18px}
.ci:hover{border-color:var(--mg);transform:translateY(-2px);box-shadow:0 0 22px rgba(56,189,248,.85),0 0 38px rgba(192,132,252,.4),0 8px 18px rgba(0,0,0,.5)}
.ci:active{transform:scale(.9)}
.ci:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
#bar{top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);display:flex;gap:20px;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-width:calc(100% - 16px)}
#bar button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
#bar span{font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#tip{top:calc(14px + var(--sat));right:12px;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;max-width:190px;font-size:13px;border-radius:14px;animation:bl .6s steps(1,end) infinite}
#tip b{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:#0f172a;border:2px solid var(--ac);color:var(--mg);font-size:16px;line-height:1}
@keyframes bl{0%{border-color:var(--ac);box-shadow:0 0 14px rgba(56,189,248,.8)}50%{border-color:transparent;box-shadow:none}}
#au-ui{top:calc(14px + var(--sat));left:12px;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;font-size:12px}
#au-ui span{opacity:.8;white-space:nowrap}#av{width:96px}
#ui{left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:2px;padding:8px 16px;box-sizing:border-box}
.row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}
.row i{display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;color:var(--fg2)}
.row i svg{width:22px;height:22px}
.row i em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.04em}
.row i b{position:absolute;top:-5px;right:2px;font-size:10px;font-weight:700;background:var(--mg);color:#0f172a;border-radius:9px;padding:0 5px;line-height:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:linear-gradient(90deg,var(--ac),var(--vi),var(--mg)) 0 50%/var(--p,0%) 6px no-repeat,linear-gradient(var(--tr),var(--tr)) 0 50%/100% 6px no-repeat;border-radius:99px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:0;background:radial-gradient(circle,#fff 0 34%,transparent 36%),linear-gradient(135deg,var(--ac),var(--mg));box-shadow:0 0 12px rgba(56,189,248,.7),0 2px 8px rgba(0,0,0,.55)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:0;background:radial-gradient(circle,#fff 0 34%,transparent 36%),linear-gradient(135deg,var(--ac),var(--mg));box-shadow:0 0 12px rgba(56,189,248,.7),0 2px 8px rgba(0,0,0,.55)}
#bub{left:0;top:0;padding:8px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;z-index:3;white-space:nowrap;border-color:var(--ac);box-shadow:0 0 16px rgba(56,189,248,.4)}
#near{left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:10px;padding:16px 22px;text-align:center;z-index:5;max-width:calc(100% - 48px)}#near.on{display:flex}#near a{padding:10px 20px;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--mg));color:#0f172a;font-weight:700;text-decoration:none}#near button{background:none;border:0;color:var(--fg2);cursor:pointer;padding:4px 10px}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 55% 50% at var(--vx,50%) var(--vy,50%),rgba(255,196,139,.16) 0%,rgba(255,196,139,.06) 40%,rgba(3,5,14,.72) 100%)}
#sry{left:0;top:0;padding:6px 12px;border-radius:12px;opacity:0;pointer-events:none;z-index:3;font-weight:700;border-color:var(--mg);box-shadow:0 0 14px rgba(244,114,182,.5)}#sry.on{opacity:1}
#bub.on{opacity:1}#bub.w{background:#fff;color:#0f172a;border-color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35)}#bub b{font-size:16px;display:block}#bub small{opacity:.75;font-size:11px}
#fade{position:fixed;inset:0;background:var(--glass);backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1;pointer-events:auto}
#fade{display:grid;place-items:center;background:rgba(15,23,42,.84)}#ld{display:grid;justify-items:center;gap:14px}#ld .hh{width:64px;height:64px;fill:#e60026;stroke:none;animation:pu .8s ease-in-out infinite alternate}#ldt{font-size:26px;letter-spacing:.3em;text-indent:.3em}.lb{width:200px;height:6px;border-radius:9px;background:var(--tr);overflow:hidden}.lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--vi),var(--mg))}#fade.on .lb i{animation:ld 1.5s ease-out forwards}@keyframes ld{to{width:100%}}@keyframes pu{to{transform:scale(1.18)}}
#toast{left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 20px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;z-index:4}
#toast.on{opacity:1}
@media(max-width:620px){#tip,#au-ui{top:calc(92px + var(--sat))}#tip{max-width:128px;font-size:12px}#au-ui span{display:none}#av{width:70px}}
@media(max-height:520px) and (min-width:700px){#ui{grid-template-columns:repeat(3,1fr);width:calc(100% - 24px);max-width:900px;gap:16px}.row{grid-template-columns:36px 1fr 36px;gap:8px}}
</style></head><body>
